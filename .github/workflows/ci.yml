name: Mock CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TARGET_ENV: stage

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mock lint
        run: |
          echo "Linting for $TARGET_ENV on $(uname -a)"
          sleep 2
          echo "Lint OK"

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Mock ${{ matrix.suite }} tests
        run: |
          echo "Running ${{ matrix.suite }} tests for $TARGET_ENV"
          sleep 3
          echo "${{ matrix.suite }} tests passed"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Mock build
        run: |
          mkdir -p dist
          echo "build $GITHUB_SHA for $TARGET_ENV" > dist/artifact.txt
          cat dist/artifact.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.TARGET_ENV }}
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ env.TARGET_ENV }}
          path: dist/
      - name: Mock deploy
        run: |
          echo "Deploying to $TARGET_ENV:"
          cat dist/artifact.txt
          echo "Deploy complete (mock)"
